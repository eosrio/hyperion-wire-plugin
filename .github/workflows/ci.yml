name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: python3 fixtures/generate-protocol-vectors.py --check
      - run: npm run check:fixtures
      - name: Check bounded SHiP range capture without services
        run: python3 -B -m unittest discover -s tests -p 'test_capture_wire_range.py'
      - name: Check actual application corpus audit and extraction guards without services
        run: python3 -B -m unittest discover -s tests -p 'test_application_capture_audit.py'
      - run: npm test
      - run: cargo test --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm run test:cross
      - run: npm run test:package
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documents and local links
        run: python3 scripts/check-docs.py
      - name: Check whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
