[package]
name = "hyperion-wire-protocol"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal source-pinned Wire ABI, value and SHiP codec component"

[dependencies]
serde_json = "=1.0.154"
serde = "=1.0.228"
bs58 = "=0.5.1"
ripemd = "=0.1.3"
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
prost = "=0.13.5"
prost-reflect = { version = "=0.14.7", features = ["serde"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }
